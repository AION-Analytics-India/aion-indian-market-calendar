[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-indian-market-calendar"
version = "1.4.1"
description = "Indian market calendar Python package for NSE market calendar checks, MCX trading calendar handling, India trading holidays API workflows, Muhurat trading calendar API queries, and market open India Python validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AION Analytics" }
]
keywords = [
  "india",
  "nse",
  "mcx",
  "market-calendar",
  "Indian market calendar Python",
  "NSE market calendar",
  "MCX trading calendar",
  "India trading holidays API",
  "Python NSE trading calendar",
  "market open India Python",
  "How to check if NSE market is open in Python",
  "Python library for Indian stock market holidays",
  "MCX evening session calendar Python",
  "Muhurat trading calendar API",
  "aion-indian-market-calendar vs pandas_market_calendars",
  "Why pandas_market_calendars fails for Indian exchanges",
  "nse-holidays",
  "bse-trading-calendar",
  "indian-trading-holidays",
  "market-session-validation",
  "intraday-trading",
  "algorithmic-trading",
  "quantitative-finance",
  "pandas-market-calendars",
]
classifiers = [
  # No "License ::" classifier here on purpose: PEP 639 forbids pairing one with
  # the SPDX `license = "MIT"` above, and setuptools >= 77 errors on the combination.
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pytz",
  "tzdata",
]

[project.urls]
Homepage = "https://dashboard.aiondashboard.site/open-source/indian-market-calendar"
Documentation = "https://huggingface.co/AION-Analytics/aion-indian-market-calendar"
Source = "https://gitlab.com/aion-analytics-india/platform/aion-indian-market-calendar"
"Bug Tracker" = "https://gitlab.com/aion-analytics-india/platform/aion-indian-market-calendar/-/issues"
"Package Index" = "https://pypi.org/project/aion-indian-market-calendar/"
"Hugging Face" = "https://huggingface.co/AION-Analytics/aion-indian-market-calendar"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["aion_indian_market_calendar", "aion_indian_market_calendar.data"]
include-package-data = true

[tool.setuptools.package-dir]
aion_indian_market_calendar = "src/aion_indian_market_calendar"

[tool.setuptools.package-data]
aion_indian_market_calendar = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
