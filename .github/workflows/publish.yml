name: publish

# Historical tag publisher; do not tag the candidate until all release gates
# and the PyPI publishing identity/environment have owner approval. Prior test
# success does not prove publishing success. Verification-only work belongs in
# verify-candidate.yml and never grants production trust or release authority.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: it has no system tz database, so a missing
        # tzdata dependency breaks every session check there and passes
        # everywhere else. The lowest version tested is the floor declared in
        # pyproject.toml (requires-python >=3.10); 3.9 was tested until 1.6.0
        # although pip refuses to install the package there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[test]"
      - name: Tests
        run: pytest -q
        env:
          AION_IN_CALENDAR_OFFLINE: "1"

  no-egress:
    # Run on its own so it cannot be lost in a matrix summary. This is the test
    # that keeps telemetry gone; if it fails, the release must not happen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e . pytest
      - name: Nothing reaches the network unless a refresh was asked for
        run: pytest tests/test_no_egress.py -q
      - name: No identifier header anywhere in the source
        run: |
          if grep -rnE 'X-AION-[A-Za-z-]*(Install|Telemetry)' src/ --include='*.py' \
             | grep -v '^\s*#' | grep -vi 'docstring'; then
            echo "an identifier header appears in source"; exit 1
          fi
          echo "clean"

  build:
    needs: [test, no-egress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token PyPI verifies. No API token.
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
