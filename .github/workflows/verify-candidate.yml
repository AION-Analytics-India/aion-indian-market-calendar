name: Verify calendar candidate without publication

on:
  push:
    branches: [ci/calendar-1.8-acceptance]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install build twine
      - name: Build exact source once
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build
          python -m twine check dist/*
          python scripts/verify_release_artifacts.py inventory --dist dist --source-sha "$GITHUB_SHA" --output ci/BUILD_INVENTORY.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calendar-candidate
          path: |
            dist/
            ci/BUILD_INVENTORY.json
          retention-days: 14

  artifacts:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: calendar-candidate, path: acceptance-input}
      - name: Wheel and full sdist context on native OS
        shell: bash
        run: |
          scope=full
          if [ "$RUNNER_OS" = Windows ]; then scope=library; fi
          python scripts/verify_release_artifacts.py test --dist acceptance-input/dist --inventory acceptance-input/ci/BUILD_INVENTORY.json --source-sha "$GITHUB_SHA" --scope "$scope" --output evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: evidence/
          retention-days: 14

  managed-lifecycle:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: calendar-candidate, path: acceptance-input}
      - name: Prepare isolated published bootstrap and dependency closure
        shell: bash
        run: |
          python -m pip install -e ".[test,updates]"
          python -c "from pathlib import Path; import shutil; p=Path('lifecycle-work'); (p/'lifecycle-dist').mkdir(parents=True); shutil.copy(next(Path('acceptance-input/dist').glob('*.whl')),p/'lifecycle-dist'); (p/'artifacts').mkdir(); (p/'repair-wheelhouse').mkdir()"
          python -m pip download --only-binary=:all: --no-deps aion-indian-market-calendar==1.7.1 --dest lifecycle-work/artifacts
          python -m pip download --only-binary=:all: "cryptography>=45,<47" "packaging>=24,<27" pytz tzdata --dest lifecycle-work/repair-wheelhouse
      - name: Actual OS scheduler, signed install, interruption, rollback and teardown
        shell: bash
        run: |
          python -c "import os,subprocess,sys,shutil,uuid; from pathlib import Path; out=Path('lifecycle-evidence'); root=(Path(os.environ['LOCALAPPDATA'])/('aion-calendar-ci-'+uuid.uuid4().hex)) if os.name=='nt' else out; result=subprocess.run([sys.executable,'scripts/verify_managed_lifecycle.py','lifecycle-work',str(root)]); out.mkdir(exist_ok=True); [shutil.copyfile(p,out/p.name) for p in root.glob('*') if p.is_file() and p.suffix in ('.json','.log') and p.parent!=out] if root!=out else None; sys.exit(result.returncode)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle-evidence/
          retention-days: 14

# No id-token, publishing, production signing credentials or production tests.
# Lifecycle jobs enroll only disposable owned per-user jobs. They must refuse
# unavailable user managers/interactive Windows sessions, never elevate or fall
# back to SYSTEM/S4U. Windows 11 real reboot/logon remains an independent gate.
